[package]
name = "raffle"
version = "0.1.0"
authors = [
    "Milosz Muszynski <milosz.muszynski@gmail.com>",
]
edition = "2024"

[dependencies]
dlmalloc = { version = "0.2", features = ["global"] }
rmp-serde = "1.3"
serde = { version = "1.0", features = ["derive"] }

[lib]
crate-type = ["cdylib", "rlib"]
