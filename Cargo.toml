[package]
name = "wasm-kv-db"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.7"
tokio = { version = "1.53", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
dashmap = "6"
wasmtime = "47.0"
thiserror = "2.0"
hex = "0.4"
rand = "0.10"
rocksdb = "0.24"
tempfile = "3.27"

[dev-dependencies]
rmp-serde = "1.3"
